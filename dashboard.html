<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Staff Dashboard – Abeeez Ladies Stitching Center</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="dash-body">

<!-- AUTH GUARD -->
<script>
  const staffData = sessionStorage.getItem('abeeez_staff');
  if (!staffData) { window.location.href = 'login.html'; }
</script>

<!-- HEADER -->
<header class="dash-header">
  <div class="dash-logo">
    <span style="font-size:1.4rem;">✿</span> Abeeez Dashboard
  </div>
  <div class="dash-user">
    <div style="text-align:right;">
      <div class="dash-user-name">Welcome, Staff</div>
      <div style="font-size:.72rem;color:var(--text-muted);" id="loginTimeEl"></div>
    </div>
    <button class="dash-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>
</header>

<!-- MAIN -->
<main class="dash-main">
  <h1 class="dash-welcome">Booking Management</h1>
  <p class="dash-sub" id="dashDate"></p>

  <!-- STATS -->
  <div class="dash-stats">
    <div class="ds-card">
      <div class="ds-icon">📋</div>
      <div class="ds-num" id="statTotal">0</div>
      <div class="ds-label">Total Bookings</div>
    </div>
    <div class="ds-card">
      <div class="ds-icon">⏳</div>
      <div class="ds-num" id="statPending">0</div>
      <div class="ds-label">Pending</div>
    </div>
    <div class="ds-card">
      <div class="ds-icon">✅</div>
      <div class="ds-num" id="statConfirmed">0</div>
      <div class="ds-label">Confirmed</div>
    </div>
    <div class="ds-card">
      <div class="ds-icon">🎉</div>
      <div class="ds-num" id="statDone">0</div>
      <div class="ds-label">Completed</div>
    </div>
  </div>

  <!-- BOOKINGS TABLE -->
  <div class="dash-panel">
    <div class="dash-panel-header">
      <h3>All Booking Requests</h3>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <input type="text" class="dash-search" id="searchInput" placeholder="🔍  Search customers…" oninput="renderTable()"/>
        <button class="btn-primary" style="padding:10px 20px;font-size:.8rem;" onclick="addSampleData()">
          <i class="fas fa-plus"></i> Add Sample Data
        </button>
        <button onclick="clearAll()" style="padding:10px 18px;background:none;border:1.5px solid #fca5a5;color:#b91c1c;border-radius:50px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:.2s;" onmouseover="this.style.background='#fef2f2'" onmouseout="this.style.background='none'">
          <i class="fas fa-trash"></i> Clear All
        </button>
      </div>
    </div>

    <div style="overflow-x:auto;">
      <table class="dash-table" id="bookingTable">
        <thead>
          <tr>
            <th>Booking ID</th>
            <th>Date Submitted</th>
            <th>Customer Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Preferred Date</th>
            <th>Service</th>
            <th>Notes</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
  const STORAGE_KEY = 'abeeez_bookings';

  // Set date & login time
  document.getElementById('dashDate').textContent = new Date().toLocaleDateString('en-IN', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  const sd = JSON.parse(sessionStorage.getItem('abeeez_staff') || '{}');
  if (sd.loginTime) {
    document.getElementById('loginTimeEl').textContent = 'Logged in at ' + new Date(sd.loginTime).toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  }

  function getBookings() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  }
  function saveBookings(arr) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }

  function updateStats() {
    const all = getBookings();
    document.getElementById('statTotal').textContent     = all.length;
    document.getElementById('statPending').textContent   = all.filter(b => b.status === 'Pending').length;
    document.getElementById('statConfirmed').textContent = all.filter(b => b.status === 'Confirmed').length;
    document.getElementById('statDone').textContent      = all.filter(b => b.status === 'Completed').length;
  }

  function renderTable() {
    const all    = getBookings();
    const query  = (document.getElementById('searchInput').value || '').toLowerCase();
    const tbody  = document.getElementById('tableBody');
    const filtered = query
      ? all.filter(b =>
          (b.name||'').toLowerCase().includes(query) ||
          (b.phone||'').toLowerCase().includes(query) ||
          (b.service||'').toLowerCase().includes(query) ||
          (b.id||'').toLowerCase().includes(query)
        )
      : all;

    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="9" class="no-data">No bookings found. Booking requests from the website will appear here.</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.slice().reverse().map(b => {
      const statusClass = {
        'Pending':   'status-pending',
        'Confirmed': 'status-confirmed',
        'Completed': 'status-done'
      }[b.status] || 'status-pending';

      const submitted = b.timestamp ? new Date(b.timestamp).toLocaleDateString('en-IN') : '—';
      const prefDate  = b.date ? new Date(b.date).toLocaleDateString('en-IN') : '—';

      return `<tr>
        <td style="font-weight:600;color:var(--purple);font-size:.78rem;">${b.id || '—'}</td>
        <td>${submitted}</td>
        <td style="font-weight:600;">${b.name || '—'}</td>
        <td><a href="tel:${b.phone}" style="color:var(--purple);text-decoration:none;">${b.phone || '—'}</a></td>
        <td style="font-size:.8rem;">${b.email || '—'}</td>
        <td>${prefDate}</td>
        <td style="font-size:.82rem;">${b.service || '—'}</td>
        <td style="font-size:.78rem;color:var(--text-muted);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${b.notes || ''}">${b.notes || '—'}</td>
        <td>
          <select class="status-select" onchange="updateStatus('${b.id}', this.value)">
            <option ${b.status==='Pending'   ? 'selected':''}>Pending</option>
            <option ${b.status==='Confirmed' ? 'selected':''}>Confirmed</option>
            <option ${b.status==='Completed' ? 'selected':''}>Completed</option>
          </select>
        </td>
      </tr>`;
    }).join('');
    updateStats();
  }

  function updateStatus(id, newStatus) {
    const all = getBookings();
    const idx = all.findIndex(b => b.id === id);
    if (idx > -1) {
      all[idx].status = newStatus;
      saveBookings(all);
      updateStats();
    }
  }

  function clearAll() {
    if (!confirm('Clear all booking data? This cannot be undone.')) return;
    localStorage.removeItem(STORAGE_KEY);
    renderTable();
  }

  function addSampleData() {
    const samples = [
      { id:'BK'+Date.now()+'1', timestamp:new Date().toISOString(), name:'Fathima Nazar',   phone:'+91 9876543210', email:'fathima@email.com', date:'2025-08-15', service:'Bridal Blouse Stitching',  notes:'Heavy embroidery, padded', status:'Pending' },
      { id:'BK'+Date.now()+'2', timestamp:new Date().toISOString(), name:'Sreeja Menon',    phone:'+91 9845671230', email:'sreeja@email.com',  date:'2025-08-18', service:'Churidar Stitching',       notes:'Anarkali style, yellow', status:'Confirmed' },
      { id:'BK'+Date.now()+'3', timestamp:new Date().toISOString(), name:'Asha Krishnan',   phone:'+91 9712345678', email:'',                 date:'2025-08-10', service:'Alteration Services',       notes:'Resize blouse', status:'Completed' },
      { id:'BK'+Date.now()+'4', timestamp:new Date().toISOString(), name:'Reshma Salim',    phone:'+91 9988776655', email:'reshma@email.com', date:'2025-08-22', service:'Designer Blouse Stitching', notes:'Back neck design attached', status:'Pending' },
    ];
    const existing = getBookings();
    saveBookings([...existing, ...samples]);
    renderTable();
  }

  function logout() {
    sessionStorage.removeItem('abeeez_staff');
    window.location.href = 'login.html';
  }

  // Auto-refresh stats every 30s (for multi-tab use)
  setInterval(renderTable, 30000);

  // Init
  renderTable();
</script>
</body>
</html>
