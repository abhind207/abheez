<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Staff Login – Abeeez Ladies Stitching Center</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="login-body" style="cursor:auto;">
 
<div class="login-page">
  <div class="login-bg-orb lbo1"></div>
  <div class="login-bg-orb lbo2"></div>
 
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">✿</div>
      <h1>Abeeez</h1>
      <p>Staff Portal — Secure Login</p>
    </div>
 
    <div class="login-err" id="loginErr">
      <i class="fas fa-exclamation-circle"></i> Invalid username or password. Please try again.
    </div>
 
    <form class="login-form" id="loginForm" novalidate>
      <div class="form-group">
        <label for="username"><i class="fas fa-user" style="color:var(--purple);margin-right:6px;"></i>Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required/>
      </div>
      <div class="form-group">
        <label for="password"><i class="fas fa-lock" style="color:var(--purple);margin-right:6px;"></i>Password</label>
        <div style="position:relative;">
          <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required style="width:100%;padding-right:44px;"/>
          <button type="button" id="togglePwd" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:.9rem;">
            <i class="fas fa-eye" id="pwdIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary login-submit">
        <i class="fas fa-sign-in-alt"></i> Sign In to Dashboard
      </button>
    </form>
 
    <a href="index.html" class="login-back"><i class="fas fa-arrow-left"></i> Back to main website</a>
  </div>
</div>
 
<script>
  // Credentials
  const CREDS = { username: 'abeez207', password: '1928' };
 
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    const errEl = document.getElementById('loginErr');
 
    if (u === CREDS.username && p === CREDS.password) {
      sessionStorage.setItem('abeeez_staff', JSON.stringify({ user: u, loginTime: Date.now() }));
      window.location.href = 'dashboard.html';
    } else {
      errEl.style.display = 'block';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
      setTimeout(() => { errEl.style.display = 'none'; }, 4000);
    }
  });
 
  // Toggle password visibility
  document.getElementById('togglePwd').addEventListener('click', function() {
    const input = document.getElementById('password');
    const icon  = document.getElementById('pwdIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'fas fa-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'fas fa-eye';
    }
  });
</script>
</body>
</html>
